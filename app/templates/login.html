<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ product }} · Sign in</title>
<style>
  :root { --ink:#1f2937; --muted:#6b7280; --rule:#e5e7eb; --brand:#0f5f8c; --bg:#f6f8fa; }
  body { margin:0; font-family: -apple-system, Inter, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  .card { max-width:380px; margin:12vh auto; background:#fff; border:1px solid var(--rule); border-radius:12px; padding:32px; }
  h1 { font-size:20px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--rule); border-radius:8px; font-size:15px; }
  button { margin-top:22px; width:100%; padding:11px; background:var(--brand); color:#fff; border:0; border-radius:8px; font-size:15px; cursor:pointer; }
  .error { background:#fef2f2; color:#991b1b; padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:8px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .dot { width:14px; height:14px; border-radius:4px; background:var(--brand); }
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="brand"><span class="dot"></span><strong>{{ product }}</strong></div>
  <h1>Sign in</h1>
  <p class="sub">Use your workspace account.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required autocomplete="current-password">
  <button type="submit">Sign in</button>
</form>
</body>
</html>
